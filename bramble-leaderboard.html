<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Bramble Leaderboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Outfit:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root { --ink: #1a120c; --cream: #fff6e4; --gold: #ffc857; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--cream);
      font-family: Outfit, "Trebuchet MS", sans-serif;
      background:
        radial-gradient(800px 360px at 50% -10%, rgba(46, 230, 199, .22), transparent 60%),
        linear-gradient(180deg, #1a120c, #0c0a09 70%);
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 36px 20px 64px; }
    a { color: #2ee6c7; font-weight: 700; }
    h1 {
      margin: 8px 0 0;
      font-family: "Lilita One", cursive;
      font-weight: 400;
      font-size: clamp(42px, 8vw, 68px);
      line-height: .9;
      color: #fff8e8;
      text-shadow: 0 4px 0 #0e8f7c;
    }
    .kicker {
      margin: 0;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-size: 12px;
      color: #e7c27a;
    }
    p { line-height: 1.45; color: #f3e2c4; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 18px;
      background: rgba(20, 14, 10, .72);
      border: 3px solid #c8924a;
      border-radius: 16px;
      overflow: hidden;
    }
    th, td { padding: 12px 14px; text-align: left; }
    th {
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #e7c27a;
      background: #24180f;
    }
    td { border-top: 1px solid rgba(255, 214, 140, .18); }
    td.time { font-family: "Lilita One", cursive; font-size: 22px; color: var(--gold); }
    .links { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 18px; }
    button {
      border: 0;
      cursor: pointer;
      font-family: "Lilita One", cursive;
      font-size: 18px;
      color: var(--ink);
      background: linear-gradient(180deg, #ffe7a3, var(--gold));
      border-radius: 12px;
      padding: 10px 14px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="kicker">Fastest full clear</p>
    <h1>Bramble Times</h1>
    <p>Anyone who finishes all 25 levels of Agent Bramble lands here. Lower time is better. A second run only replaces your name if it is faster.</p>
    <div class="links">
      <a href="index.html">Game room</a>
      <a href="agent-bramble.html">Play Agent Bramble</a>
    </div>
    <p id="status">Loading times…</p>
    <table id="board" hidden>
      <thead>
        <tr><th>Rank</th><th>Name</th><th>Time</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <p><button id="refresh" type="button">Refresh</button></p>
  </div>
  <script src="bramble-board.js"></script>
  <script>
    var statusEl = document.getElementById("status");
    var table = document.getElementById("board");
    var body = document.getElementById("rows");

    async function draw() {
      statusEl.textContent = "Loading times…";
      table.hidden = true;
      body.innerHTML = "";
      try {
        var rows = await BrambleBoard.list();
        if (!rows.length) {
          statusEl.textContent = "No times yet. Finish all 25 levels and your name shows up here.";
          return;
        }
        statusEl.textContent = rows.length === 1 ? "1 time saved." : rows.length + " times saved.";
        rows.forEach(function (row, i) {
          var tr = document.createElement("tr");
          tr.innerHTML = "<td>" + (i + 1) + "</td><td>" + row.name.replace(/[&<>]/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c];
          }) + "</td><td class=\"time\">" + BrambleBoard.format(row.ms) + "</td>";
          body.appendChild(tr);
        });
        table.hidden = false;
      } catch (e) {
        statusEl.textContent = "The leaderboard could not be loaded. Check your connection and try again.";
      }
    }

    document.getElementById("refresh").addEventListener("click", draw);
    draw();
  </script>
</body>
</html>
